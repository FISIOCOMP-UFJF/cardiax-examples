# ===================================================================
#  LINEAR ELASTICITY BENCHMARK 4 — PLATE WITH A HOLE (Kirsch)
# ===================================================================
#  Quarter model of a plate with a central circular hole (radius R)
#  under remote uniaxial tension S in +x. O-grid from hole edge (r=R)
#  to outer square [0,W]x[0,W], one hex layer in z.
#    R = 0.5, W = 5.0, thickness = 0.1, E = 1000, nu = 0.3, S = 1.0
#  BCs: x=0 cut u_x=0; y=0 cut u_y=0; z=0 layer u_z=0 (in mesh XML).
#  Exact (Kirsch): Kt = 3, sigma_theta_max = 3 S at hole top (theta=90).
#    (W/R finite here -> expect Kt slightly below 3.)

[problem]
model        = "elasticity"
mesh         = "plate_hole.xml"
problem_type = "THREE_DIM"      # THREE_DIM | PLANE_STRAIN | PLANE_STRESS

[material]
young   = 1000.0
poisson = 0.3

# Neumann: remote tension on the x=W edge (marker 10), traction in +x
[[neumann]]
marker = 10
t = [1.0, 0.0, 0.0]

[solver]
penalty = 1.0e10

[solver.petsc]
ksp_type = "preonly"
pc_type  = "lu"

[output]
filename = "output_plate_hole"
