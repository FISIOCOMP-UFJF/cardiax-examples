# ============================================================
#  Poisson solver input
# ============================================================

[problem]
model = "poisson"
mesh  = "unit_quad_08.xml"
#mesh  = "unit_quad_16.xml"
#mesh  = "unit_quad_32.xml"
#mesh  = "unit_quad_64.xml"

# ------------------------------------------------------------
#  Numerics: discretization + linear solver
# ------------------------------------------------------------
[numerics]
linear_solver  = "cg"     # cg | gmres | direct  (KSP type)
preconditioner = "ilu"    # jacobi | ilu | hypre ...
rel_tol        = 1e-8
abs_tol        = 1e-12
max_iter       = 1000

# ------------------------------------------------------------
#  Physical: PDE coefficients and source
#     -div(k grad u) = f
# ------------------------------------------------------------
[physical]
conductivity = 1.0                   # k  (scalar; make it a tensor block if needed)
source       = "sin(pi*x)*sin(pi*y)" # f
#source       = 0.0                  # f  (constant source term)

[[physical.dirichlet]]
marker = 7
value = 0.0

#[[physical.neumann]]
#marker = 3
#value = 0.5

#[[physical.fix_node]]
#index = 0
#value = 0.0

[validation]
exact = "(1/(2*pi^2))*sin(pi*x)*sin(pi*y)"

# ------------------------------------------------------------
#  Output
# ------------------------------------------------------------
[output]
directory = "output_poisson_unit_quad"
format    = "hdf5"  # hdf5 (+xdmf) | vtk
