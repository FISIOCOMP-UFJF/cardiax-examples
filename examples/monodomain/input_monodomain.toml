# ============================================================
#  Monodomain solver input
# ============================================================

[problem]
model = "monodomain"
mesh  = "benchmark_slab_0p5mm.xml"

# ------------------------------------------------------------
#  Time integration
#  (new block: monodomain is time-dependent, unlike poisson/eikonal)
# ------------------------------------------------------------
[time]
t_end     = 100.0     # total simulated time [ms]
dt        = 0.05      # time step [ms]
dt_output = 1.0       # interval between saved frames [ms]

# ------------------------------------------------------------
#  Numerics: discretization + linear solver
#  (same names/structure as poisson's [numerics])
# ------------------------------------------------------------
[numerics]
linear_solver  = "cg"     # cg | gmres | direct  (KSP type)
preconditioner = "ilu"    # jacobi | ilu | hypre ...
rel_tol        = 1e-8
abs_tol        = 1e-12
max_iter       = 1000
theta          = 0.5      # time-integration weight (0=explicit, 0.5=CN, 1=implicit)

# ------------------------------------------------------------
#  Cell (ionic) model
#  (new block: defines I_ion; monodomain-specific)
# ------------------------------------------------------------
[cell_model]
name = "TT2"           # e.g. ToRORd | TT2 | FHN | mitchell_schaeffer
Cm   = 1.0                # membrane capacitance [uF/cm^2]

# ------------------------------------------------------------
#  Physical: tissue conductivities
#  (mirrors eikonal's conductivity_type + vel_f/vel_s/vel_n,
#   here as conductivities sigma_f/sigma_s/sigma_n)
# ------------------------------------------------------------
[physical]
conductivity_type = "transversely_isotropic"   # isotropic | transversely_isotropic | orthotropic

sigma_f = 0.0001334        # fiber-direction conductivity [mS/cm]
sigma_s = 0.0000176        # sheet-direction conductivity
sigma_n = 0.0000176        # normal-direction conductivity

beta = 1400.0              # surface-to-volume ratio [1/cm]

# ------------------------------------------------------------
#  Stimuli
#  Each [[stimulus]] applies a current in a spatial box.
#  Fields map directly from the mesh <stim .../> attributes.
#  Coordinates are in the mesh's units (micrometers here).
# ------------------------------------------------------------
[[stimulus]]
start    = 0.0        # onset time [ms]         (<stim start>)
duration = 2.0        # duration [ms]           (<stim duration>)
value    = -50.0      # stimulus current value  (<stim value>)
x0 = 0.0
x1 = 1500.0
y0 = 0.0
y1 = 1500.0
z0 = 0.0
z1 = 1500.0

# add more stimuli freely
# [[stimulus]]
# start    = 5.0
# duration = 2.0
# value    = -50.0
# x0 = 0.0
# x1 = 1500.0
# y0 = 0.0
# y1 = 1500.0
# z0 = 0.0
# z1 = 1500.0

# ------------------------------------------------------------
#  Output
#  (same keys as poisson: filename + format; plus optional fields)
# ------------------------------------------------------------
[output]
filename = "output_monodomain"
format   = "hdf5"     # hdf5 (+xdmf) | vtk
